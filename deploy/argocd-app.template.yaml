apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-agent-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '__GITOPS_REPO_URL__'
    path: deploy/workloads
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: k8s-agent-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
