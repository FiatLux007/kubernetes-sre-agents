apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: k8s-agent-demo
  labels:
    app: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Error: missing required environment variable DEMO_REQUIRED_CONFIG"
              exit 1
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m

